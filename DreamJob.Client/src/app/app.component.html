<div class="app-container">
  <!-- Header -->
  <header class="header">
    <div class="header-content">
      <h1 class="brand">DreamJob</h1>
      <p class="tagline">Design Your Perfect Career</p>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    <div class="error-message" *ngIf="error">
      {{ error }}
    </div>

    <div class="loading" *ngIf="loading">
      Loading your dream job...
    </div>

    <div class="job-container" *ngIf="!loading && dreamJob">
      <!-- Title Pane -->
      <section class="pane title-pane">
        <div class="pane-header">
          <h2>Job Title</h2>
          <button 
            class="edit-button" 
            (click)="enterTitleEditMode()"
            *ngIf="!isTitleEditMode">
            Edit
          </button>
        </div>
        
        <div class="pane-content" *ngIf="!isTitleEditMode">
          <h3 class="job-title">{{ dreamJob.title }}</h3>
        </div>

        <div class="pane-content edit-mode" *ngIf="isTitleEditMode">
          <input 
            type="text" 
            class="title-input" 
            [(ngModel)]="editTitle"
            placeholder="Enter job title">
          <div class="button-group">
            <button class="save-button" (click)="saveTitleEdit()">Save</button>
            <button class="cancel-button" (click)="cancelTitleEdit()">Cancel</button>
          </div>
        </div>
      </section>

      <!-- Skills Pane -->
      <section class="pane skills-pane">
        <div class="pane-header">
          <h2>Required Skills</h2>
          <button 
            class="edit-button" 
            (click)="enterSkillsEditMode()"
            *ngIf="!isSkillsEditMode">
            Edit
          </button>
        </div>
        
        <div class="pane-content" *ngIf="!isSkillsEditMode">
          <div class="skills-container">
            <span class="skill-badge" *ngFor="let skill of dreamJob.skills">
              {{ skill }}
            </span>
          </div>
        </div>

        <div class="pane-content edit-mode" *ngIf="isSkillsEditMode">
          <div class="skills-edit-section">
            <h4>Common Skills</h4>
            <div class="common-skills-grid">
              <label 
                class="skill-checkbox" 
                *ngFor="let skill of commonSkills"
                [class.selected]="isSkillSelected(skill)">
                <input 
                  type="checkbox" 
                  [checked]="isSkillSelected(skill)"
                  (change)="toggleSkill(skill)">
                <span>{{ skill }}</span>
              </label>
            </div>
          </div>

          <div class="custom-skill-section">
            <h4>Add Custom Skill</h4>
            <div class="custom-skill-input-group">
              <input 
                type="text" 
                class="custom-skill-input"
                [(ngModel)]="customSkillInput"
                placeholder="Enter custom skill"
                (keyup.enter)="addCustomSkill()">
              <button class="add-button" (click)="addCustomSkill()">Add</button>
            </div>
          </div>

          <div class="selected-skills-section" *ngIf="selectedSkills.size > 0">
            <h4>Selected Skills ({{ selectedSkills.size }})</h4>
            <div class="selected-skills-container">
              <span 
                class="skill-badge removable" 
                *ngFor="let skill of selectedSkills"
                (click)="removeSkill(skill)">
                {{ skill }} ×
              </span>
            </div>
          </div>

          <div class="button-group">
            <button class="save-button" (click)="saveSkillsEdit()">Save</button>
            <button class="cancel-button" (click)="cancelSkillsEdit()">Cancel</button>
          </div>
        </div>
      </section>

      <!-- Details Pane -->
      <section class="pane details-pane">
        <div class="pane-header">
          <h2>Job Details</h2>
          <button 
            class="edit-button" 
            (click)="enterDetailsEditMode()"
            *ngIf="!isDetailsEditMode">
            Edit
          </button>
        </div>
        
        <div class="pane-content" *ngIf="!isDetailsEditMode">
          <div class="job-details" [innerHTML]="dreamJob.jobDetails | slice:0:1000"></div>
        </div>

        <div class="pane-content edit-mode" *ngIf="isDetailsEditMode">
          <textarea 
            class="details-textarea" 
            [(ngModel)]="editDetails"
            placeholder="Enter job details"
            rows="15"></textarea>
          <div class="button-group">
            <button class="save-button" (click)="saveDetailsEdit()">Save</button>
            <button class="cancel-button" (click)="cancelDetailsEdit()">Cancel</button>
          </div>
        </div>
      </section>
    </div>
  </main>
</div>
